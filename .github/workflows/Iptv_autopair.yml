name: IPTV 9Xtream Auto Pairing

on:
  push:
    paths:
      - 'iptv_image.jpg'
      - 'remote_code.jpg'
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  auto-pair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara libgl1
          pip install opencv-python-headless pytesseract requests playwright
          playwright install chromium

      - name: Process Images and Auto Pair via Remote
        run: |
          python auto_pair.py iptv_image.jpg remote_code.jpg
